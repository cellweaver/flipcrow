[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flipcrow"
version = "0.1.0"
requires-python = ">=3.11"
description = "Single-cell RNA-seq reanalysis of metastatic pancreatic ductal adenocarcinoma (SCP1644), reimplementing the core analysis of Raghavan et al., Cell 2021, in Scanpy"
readme = "README.md"
license = {text = "MIT License"}
authors = [
  {name = "Daniel Weaver", email = "greatergreen@protonmail.com"},
]
dependencies = [
  "scanpy",
  "anndata",
  "scikit-image",   # required by scanpy.pp.scrublet
  "gseapy",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
  "openpyxl",       # required by pandas.read_excel for the marker gene table
  "python-igraph",  # required by leidenalg
  "leidenalg",      
  "gprofiler-official",
  "decoupler",
]

[project.optional-dependencies]
notebooks = ["jupyter", "decoupler", "pydeseq2"]

dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
