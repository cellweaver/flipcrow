[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flipcrow"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "pandas",
  "scipy",
]
authors = [
  {name = "Daniel Weaver", email = "greatergreen@protonmail.com"},
]
description = "scRNAseq ML exploration"
readme = "README.md"
